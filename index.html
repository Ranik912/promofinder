<main><aside><strong><i>◧</i> Prompt Studio</strong><small>Workspace</small><button id="ten" class="active">▤　Top 10 promos</button><button id="all">▦　All episodes</button><button id="newPack">＋　New screenplay</button><button id="guide">ⓘ　Workspace tour</button><div class="bottom"><small>Export</small><div class="stack"><button id="short">↓　Shortlist JSON</button><button id="full">↓　Full results</button></div><p id="status" role="status">Opening saved run…</p></div></aside>
<section class="workspace"><small id="project">Screenplay library</small><h1 id="title">Promo shortlist</h1><p id="meta"></p><div class="filters"><label for="sort">Sort by</label><span class="sortbox"><select id="sort"><option value="rank">Highest rank</option><option value="episode">Episode number</option><option value="seconds">Shortest duration</option></select></span></div><div id="cards"></div></section>
<article id="studio"><div class="head"><small>Clip studio</small><span id="rank" class="meta"></span></div><h2 id="ep">Select a promo</h2><div id="detail"></div><div class="tools" id="tools" hidden><button id="prev" aria-label="Previous promo">←</button><button class="primary" id="export">Export cut ↓</button><button id="next" aria-label="Next promo">→</button></div></article></main>

<script>
const $=id=>document.getElementById(id);
function add(parent,tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n}
let data,rows=[],selected,showAll=false;
function save(value,name){if(!value)return;const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function inspect(r){
 selected=r;$('detail').replaceChildren();$('tools').hidden=!r;$('rank').textContent=r?'Rank '+r.rank:'';$('ep').textContent=r?'Episode '+String(r.episode).padStart(2,'0'):'No eligible promos';
 if(!r)return;
 for(const card of $('cards').children)card.setAttribute('aria-pressed',String(Number(card.dataset.rank)===r.rank));
 const page=add($('detail'),'div','','sheet');add(page,'small','Opening hook');add(page,'blockquote',r.hook);add(page,'small','Cliffhanger');add(page,'p',r.cliffhanger);
 add($('detail'),'h3','Cut sequence · '+r.seconds+' s');r.segments.forEach((s,i)=>add($('detail'),'div',(i+1)+'　 '+s.start+'　→　'+s.end,'range'));
 add($('detail'),'h3','Editorial notes');add($('detail'),'p',r.why);add($('detail'),'small','Score '+r.score+' · '+data.engine);
 $('prev').disabled=rows.indexOf(r)===0;$('next').disabled=rows.indexOf(r)===rows.length-1;
}
function render(){
 if(!data)return;rows=(showAll?data.promos:data.promos.slice(0,10)).slice().sort((a,b)=>a[$('sort').value]-b[$('sort').value]);
 $('ten').classList.toggle('active',!showAll);$('all').classList.toggle('active',showAll);$('title').textContent=showAll?'All episodes':'Promo shortlist';
 $('meta').textContent=rows.length+' promos · '+data.episodes_read+' episodes analyzed';$('cards').replaceChildren();
 for(const r of rows){const card=add($('cards'),'button','','card');card.dataset.rank=r.rank;const poster=add(card,'span',String(r.episode).padStart(2,'0'),'poster');poster.style.setProperty('--tint',['#fc694f','#bc849e','#a392c3','#cb9f61'][r.rank%4]);const info=add(card,'span','');add(info,'small','Rank '+r.rank+'　/　EP '+r.episode);add(info,'b',r.hook);add(info,'span',r.segments.length+' parts　·　'+r.seconds+' s','meta');card.onclick=()=>{inspect(r);if(matchMedia('(max-width:700px)').matches)$('studio').scrollIntoView()}}
 inspect(rows.includes(selected)?selected:rows[0]);
}
$('ten').onclick=()=>{showAll=false;render()};$('all').onclick=()=>{showAll=true;render()};$('sort').onchange=render;
$('prev').onclick=()=>inspect(rows[rows.indexOf(selected)-1]);$('next').onclick=()=>inspect(rows[rows.indexOf(selected)+1]);
$('export').onclick=()=>save(selected,'episode-'+selected.episode+'.json');$('short').onclick=()=>data&&save(data.promos.slice(0,10),'top-10.json');$('full').onclick=()=>save(data,'ranked.json');
let uploadFile=null,busy=false;
function choose(file){
 if(!file)return;
 const valid=/\.zip$/i.test(file.name)&&file.size>0&&file.size<=20000000;
 uploadFile=valid?file:null;$('filename').textContent=file.name;
 $('uploadMsg').textContent=valid?'Ready to analyze.':'Choose a nonempty ZIP under 20 MB.';$('run').disabled=!valid;
}
$('newPack').onclick=()=>$('upload').showModal();
$('closeUpload').onclick=()=>$('upload').close();
$('pick').onclick=()=>$('pack').click();$('pack').onchange=e=>choose(e.target.files[0]);
$('pick').ondragover=e=>{e.preventDefault();$('pick').classList.add('over')};
$('pick').ondragleave=()=>$('pick').classList.remove('over');
$('pick').ondrop=e=>{e.preventDefault();$('pick').classList.remove('over');if(!busy)choose(e.dataTransfer.files[0])};
$('run').onclick=async()=>{
 const file=uploadFile;if(!file||busy)return;busy=true;$('pick').disabled=$('run').disabled=true;$('uploadMsg').textContent='Comparing moments…';
 try{const res=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/zip'},body:file});
 if(!res.ok)throw Error(await res.text());data=await res.json();$('project').textContent=file.name;showAll=false;render();$('status').textContent='Analysis complete.';$('upload').close();uploadFile=null;$('pack').value='';$('filename').textContent='Choose a screenplay ZIP';$('uploadMsg').textContent=''}
 catch(e){$('uploadMsg').textContent=e.message}finally{busy=false;$('pick').disabled=false;$('run').disabled=!uploadFile}};
const steps=[
 ['#ten','Your top 10','Start with the ten highest-ranked promos from the analyzed episodes.'],
 ['#all','Browse every candidate','Open All episodes to inspect the full ranked run.'],
 ['#newPack','Analyze another screenplay','Choose or drop a screenplay ZIP in the upload window, then select Find promos.'],
 ['#sort','Change the order','Sort the current list by rank, episode number, or shortest duration.'],
 ['.card','Inspect a promo','Select an episode card to see its opening hook, cliffhanger, and both source ranges in Clip Studio.'],
 ['#tools','Review the cut','Move between promos with the arrows, or export the selected cut as JSON.'],
 ['#short','Download your results','Export the shortlist here. Use Full results below for the complete run.']
];
let activeSteps=[],step=0;
function positionTour(){
 if(!$('tour').open)return;
 const r=document.querySelector(activeSteps[step][0]).getBoundingClientRect(),tip=$('tip'),spot=$('spot');
 Object.assign(spot.style,{left:r.left-4+'px',top:r.top-4+'px',width:r.width+8+'px',height:r.height+8+'px'});
 const clamp=(n,lo,hi)=>Math.max(lo,Math.min(n,hi));
 let x=r.left,y=r.bottom+12;
 if(y+tip.offsetHeight>innerHeight-10)y=r.top-tip.offsetHeight-12;
 if(y<10){x=r.right+12;y=r.top}
 tip.style.left=clamp(x,12,innerWidth-tip.offsetWidth-12)+'px';
 tip.style.top=clamp(y,10,innerHeight-tip.offsetHeight-10)+'px';
}
function showStep(){
 const [selector,title,msg]=activeSteps[step];$('tourTitle').textContent=title;$('explain').textContent=msg;$('count').textContent='Workspace tour · '+(step+1)+' of '+activeSteps.length;
 $('back').disabled=step===0;$('forward').textContent=step===activeSteps.length-1?'Finish':'Next';
 document.querySelector(selector).scrollIntoView({block:'center',inline:'nearest'});positionTour();requestAnimationFrame(positionTour);
}
function startTour(){activeSteps=steps.filter(([s])=>document.querySelector(s)?.getClientRects().length);step=0;$('tour').showModal();showStep();$('forward').focus()}
function finishTour(){$('tour').close();try{localStorage.setItem('promofinder.tour.1','done')}catch{}$('guide').focus({preventScroll:true})}
$('guide').onclick=startTour;$('forward').onclick=()=>{if(step+1===activeSteps.length)finishTour();else{step++;showStep()}};
$('back').onclick=()=>{if(step){step--;showStep()}};$('skip').onclick=finishTour;$('tour').oncancel=e=>{e.preventDefault();finishTour()};
addEventListener('resize',positionTour);document.addEventListener('scroll',positionTour,true);
function firstVisit(){try{if(localStorage.getItem('promofinder.tour.1'))return}catch{}if(!$('upload').open&&!$('tour').open)startTour()}
fetch('/results').then(r=>{if(!r.ok)throw Error('Unable to load results.');return r.json()}).then(d=>{data=d;render();$('status').textContent='Original demo screenplay · upload a ZIP for your own shortlist';firstVisit()}).catch(e=>$('status').textContent=e.message);
</script></html>
